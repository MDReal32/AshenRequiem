plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

def cfProjectId = (findProperty('curseforge.projectId') ?: System.getenv('CURSEFORGE_PROJECT_ID')) as String
def tokenProvider = providers.environmentVariable('CURSEFORGE_TOKEN')
def cfLoader = (findProperty('curseforge.loader') ?: 'neoforge') as String
def cfVersionsRaw = (findProperty('curseforge.gameVersions') ?: '1.21.1') as String
def cfReleaseType = (findProperty('curseforge.releaseType') ?: 'release') as String
def cfChangelog = (findProperty('curseforge.changelogFile') ?: 'CHANGELOG.md') as String

def cfVersions = cfVersionsRaw.split(/[,\n]/)*.trim().findAll { it }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

dependencies {
    implementation project(':mods:core')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             kotlin_version_range   : kotlin_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

if (cfProjectId && tokenProvider.isPresent()) {
    curseforge {
        apiToken = tokenProvider

        publications {
            register("curseForge") {
                projectId = cfProjectId

                // Display name will show up on CurseForge
                displayName = provider { "${project.name} ${project.version}" }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
